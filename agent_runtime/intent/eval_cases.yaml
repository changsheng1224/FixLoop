# --- Large mixed inputs: prose + source paste + traceback (stack-first slots) ---
- id: large_code_plus_stack_repair
  channel: repair
  text: |
    用户贴了一大段无关工具代码，但真正出错在 calculator:

    ```python
    # helpers/path_utils.py — noise file names in paste
    def load_config(path="settings.py"):
        return path

    def walk_repo(root="src/legacy_app.py"):
        for name in ("a.py", "b.py", "c.py", "noise_module.py"):
            print(name)
        return root

    class Dummy:
        def run(self):
            return "ok"
    ```

    Traceback (most recent call last):
      File "calculator.py", line 42, in add
        return a + b
    TypeError: unsupported operand type(s) for +: 'int' and 'str'
  expect:
    mode: single
    primary: repair_issue
    action: run_repair
    slots:
      suspect_files: [calculator.py]
      issue_type: type_error
  tags: [repair, large, stack_parse, anti_noise]

