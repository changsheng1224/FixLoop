# Simulated real-user REPL / repair traffic for Intent Router offline eval.
#
# Target mix (approximate share of *weighted* traffic):
#   ask_howto        ~22%   how-to / config / "why" without stack
#   repair_stack     ~18%   paste traceback / CI failure
#   repair_nl        ~10%   "it's broken" / soft repair without full stack
#   vague_clarify    ~12%   deixis, underspecified, should NOT auto-exec
#   enterprise       ~14%   review/refactor/test/implement/debug/search/plan
#   explain          ~6%
#   remember         ~4%
#   multi_turn       ~8%    anaphora / continue / clarify-resume
#   hybrid           ~4%    repair + scope constraint
#   meta             ~2%    help / cancel / oos joke
#
# weight: relative traffic mass for weighted_misroute_rate (not uniform).
# stratum: bucket for by_stratum report.
# Tags always include `realistic_user`.
#
# These cases intentionally include typos, code-switch, noise, and soft gold
# where clarify is the *correct* product behavior.

