    expect: repo_code_search
    tags: [positive, search, hard, zh]
  - id: zh-sr-03
    text: Where is the class RepairState 定义在哪？
    expect: repo_code_search
    tags: [positive, search, hard, zh]
  - id: zh-bv-01
