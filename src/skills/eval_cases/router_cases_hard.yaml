    expect: draft_pr_prepare
    tags: [noise, hard, zh]
  - id: zh-ng-01
    text: 帮我推荐一部周末看的电影
    expect: null
    tags: [negative, hard, zh]
  - id: zh-ng-02
    text: 把这段英文翻译成日语
    expect: null
    tags: [negative, hard, zh]
  - id: zh-sw-01
    text: 接下来 apply the patch
    expect: patch_apply_check
    previous: stacktrace_localization
    tags: [switch, hard, zh]
  - id: zh-sw-02
