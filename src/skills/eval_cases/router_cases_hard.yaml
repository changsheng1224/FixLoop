    expect: draft_pr_prepare
    tags: [positive, draft_pr, hard, zh]
  - id: zh-dp-02
    text: 请 prepare a draft pr，标题写修复 TypeError
    expect: draft_pr_prepare
    tags: [positive, draft_pr, hard, zh]
  - id: zh-dp-03
    text: Open a draft PR 到 master 分支
    expect: draft_pr_prepare
    tags: [positive, draft_pr, hard, zh]
  - id: zh-hx-01
