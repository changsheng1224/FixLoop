    tags: [confusion, hard, zh]
  - id: zh-hx-04
    text: Select regression tests for changed util.py，基线已经跑过了
    expect: regression_test_selection
    tags: [confusion, hard, zh]
  - id: zh-nz-01
    text: |
      开会备注：明天 demo
      请 run baseline tests before the fix
      另外记得订会议室
    expect: baseline_verify
    tags: [noise, hard, zh]
  - id: zh-nz-02
