  # --- regression_test_selection positives (15) ---
  - id: rg-01
    text: |
      diff --git a/calc.py b/calc.py
      --- a/calc.py
      +++ b/calc.py
      @@ -1,3 +1,4 @@
      +def add(a,b): return a+b
      Select regression tests
    expect: regression_test_selection
    tags: [positive, regression]
  - id: rg-02
    text: Select tests for changed files calc.py and util.py
    expect: regression_test_selection
    tags: [positive, regression]
