# FixLoop Test CI — 默认不自动运行。
# 启用：取消下方 push / pull_request 注释，并注释掉 workflow_dispatch。
name: Test

on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check agent_runtime src tests

      - name: Ruff format
        run: ruff format --check agent_runtime src tests

      - name: Pytest
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest tests/ -v --cov=agent_runtime --cov=src --cov-report=term-missing
