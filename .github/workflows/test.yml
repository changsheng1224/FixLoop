name: Test

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check agent_runtime src tests

      - name: Ruff format
        run: python -m ruff format --check agent_runtime src tests

      - name: Shared contracts
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests/test_patch_contract.py tests/test_patch_backends.py tests/test_execution_contract.py tests/test_retry_policy.py tests/test_repair_flow_parity.py tests/test_exploration_runtime.py tests/test_config_contracts.py tests/test_web.py tests/test_web_research.py tests/test_linux_test_execution.py -q -p no:cacheprovider

      - name: LangGraph stage graph and owner execution
        env:
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests/test_langgraph_execution.py tests/test_repair_graph.py tests/test_repair_graph_entry.py -q -p no:cacheprovider

      - name: Clean wheel and installed offline evaluation
        run: python scripts/wheel_smoke.py

  full-unit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/ -q
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
