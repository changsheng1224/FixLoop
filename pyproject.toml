[project]
name = "agent_runtime"
version = "0.1.0"
description = "Multi-Agent code repair system with hand-written Agent runtime kernel"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "haoyu" }
]

dependencies = [
    "pydantic>=2.0",
    "tiktoken>=0.5",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]
encrypt = [
    "cryptography>=40.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_runtime*"]

[tool.setuptools.package-data]
agent_runtime = ["data/tokenizers/**/*", "data/tiktoken/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts", "src/eval/cases", "demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"tests/test_light_client.py" = ["N802", "E501"]
"tests/test_providers_replay.py" = ["N802", "E501"]
"src/repair_factory.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
